name: pipeline
on: [pull_request]
permissions:
  contents: read
  pull-requests: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: pip install semgrep
      - run: semgrep scan --config p/javascript --error
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: docker run --rm -v "$PWD":/src aquasec/trivy:latest config --exit-code 1 --severity HIGH,CRITICAL /src
      - name: Iniciar aplicación
        run: |
          node app.js &
          echo $! > app.pid

          for i in {1..30}; do
            if curl --fail --silent "http://localhost:3000/total?p=100&c=2" > /dev/null; then
              echo "Aplicación disponible"
              exit 0
            fi
            sleep 2
          done

          echo "Error: la aplicación no arrancó"
          exit 1

      - name: Escaneo DAST con OWASP ZAP
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000'
          fail_action: false
          allow_issue_writing: false
      - name: Detener aplicación
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" || true
          fi
